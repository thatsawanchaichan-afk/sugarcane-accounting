<html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>สมุดบัญชีธุรกิจอ้อย</title>
<style>
:root{color-scheme:light;--ink:#172e26;--green:#204d3b;--mint:#e6efe3;--cream:#f7f6f0;--line:#dce4d9;--muted:#52665b;--gold:#f4ca75}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{background:#123728;color:white}header div,main{max-width:1140px;margin:auto;padding:24px}header div{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header strong{letter-spacing:.04em}small,.muted{color:var(--muted)}header small{color:#c9dacb}main{padding-top:24px}.hero{border-radius:24px;background:linear-gradient(118deg,#204d3b,#38684a);color:white;padding:32px;position:relative;overflow:hidden}.hero:after{content:'◜';position:absolute;font-size:260px;right:6%;top:-80px;color:#f4ca753b;pointer-events:none}.kicker{color:var(--gold);font-size:.82rem;letter-spacing:.14em}h1{font-size:clamp(28px,5vw,46px);margin:8px 0}h2{margin:0 0 14px}p{line-height:1.55}.hero p{margin:0;color:#e1ecde}.toolbar,nav,.actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:16px 0}.toolbar{justify-content:space-between}.toolbar label{display:flex;gap:8px;align-items:center}button{border:1px solid var(--line);background:white;color:var(--green);padding:9px 14px;border-radius:10px;font-weight:650}button.active,button.primary{background:var(--green);color:white;border-color:var(--green)}button:hover{filter:brightness(.94)}button:disabled{opacity:.6;cursor:wait}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric,.box{border:1px solid var(--line);background:white;border-radius:16px;padding:18px}.metric strong{display:block;font-size:clamp(19px,3vw,28px);margin-top:5px}.box{margin:14px 0}.table{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px 12px;font-size:.9rem}th{background:#eef3ec}form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}form label{display:grid;gap:5px;font-size:.9rem;font-weight:600}input,select{min-width:0;width:100%;padding:9px;border:1px solid #b9c9bd;border-radius:8px;background:white;color:var(--ink)}.status{font-size:.85rem}.warn{color:#8e3d24}.pill{background:var(--mint);border-radius:99px;padding:5px 10px}.bar{height:6px;background:var(--mint);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}.sub{margin:0 0 12px}.form-actions{grid-column:1/-1;margin:0}.empty{padding:14px;color:var(--muted)}a{color:inherit}@media(max-width:720px){main,header div{padding:14px}.hero{padding:24px}.grid,form{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:400px){form{grid-template-columns:1fr}}

.debt-total{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:800;margin:.35rem 0;color:#173d2c}
.debt-group>summary{cursor:pointer;font-weight:700}.debt-group>summary:focus-visible{outline:2px solid #27774c;outline-offset:5px}
.debt-group-heading{display:inline-flex;align-items:baseline;justify-content:space-between;gap:.5rem 1rem;width:calc(100% - 1.5rem);flex-wrap:wrap}
.debt-group-amount{color:#173d2c;font-size:1.18rem}.debt-group-sub{display:block;font-size:.86rem;font-weight:400;margin:.25rem 0 0 1.25rem}
.debt-group[open]>summary{margin-bottom:1rem}.debt-group>h3{margin-top:1rem}

[hidden]{display:none!important}
.account-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:20px}
.account-choice{min-height:124px;width:100%;text-align:left;padding:24px;border-radius:16px;background:#fff;color:var(--ink);border:1px solid var(--line);font-size:clamp(1.05rem,2vw,1.3rem)}
.account-choice:hover,.account-choice:focus-visible{border-color:var(--green);background:var(--mint)}
.account-choice span{float:right;color:var(--green)}
@media(max-width:550px){.account-choices{grid-template-columns:1fr}.account-choice{min-height:92px}}
.menu-row{border:1px solid #d6dfd7;border-radius:12px;padding:12px;margin:10px 0}.menu-grip{touch-action:none;cursor:grab}.menu-tree{display:flex;gap:8px;flex-wrap:wrap}.menu-tree details{border:1px solid #d6dfd7;border-radius:12px;padding:10px}.menu-tree summary{cursor:pointer;padding:8px}.menu-tree button{margin:4px}</style>
<header><div><strong>🌾 สมุดบัญชีธุรกิจอ้อย</strong><small id="status" role="status">กำลังโหลดข้อมูล</small></div></header>
<main><section class="hero"><div class="kicker">สมุดบัญชีส่วนตัว</div><h1 id="account-title">เลือกบัญชี</h1></section>
<div class="toolbar" id="account-controls" hidden><button type="button" data-account="">กลับหน้าเลือกบัญชี</button><label hidden><span id="period-label">ปีงบ</span> <select id="season"></select></label><span class="muted" id="period"></span></div>
<section id="record-search" class="box" hidden><form data-form="record-search"><label class="form-actions">ค้นหารายการ<input id="search-query" name="query" type="search" placeholder="ชื่อคนงาน ลูกไร่ เลขตั๋ว รถ วันที่ หรือยอดเงิน"></label><div class="actions form-actions"><button class="primary" type="submit">ค้นหา</button><button type="button" data-clear-search>ล้างคำค้น</button></div></form><p class="muted sub">ค้นหาในบัญชีนี้ ตามปีที่เลือก รวมทะเบียนแปลง รถ อัตรา และหนี้ที่ไม่แยกปี · วันที่ค้นได้ทั้ง พ.ศ. และ ค.ศ.</p><div id="search-results" aria-live="polite"></div></section><nav id="tabs" aria-label="เมนูบัญชี" hidden></nav><div id="screen"></div></main>
<script>
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const num=value=>Number(value)||0;
const fmt=value=>num(value).toLocaleString('th-TH',{maximumFractionDigits:2});
const money=value=>fmt(value)+' บ.';
const cents=value=>Math.round(num(value)*100)/100;
const dateFormat=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'});
function today(){
 const parts=Object.fromEntries(dateFormat.formatToParts(new Date()).map(part=>[part.type,part.value]));
 return [parts.year,parts.month,parts.day].join('-');
}
function fiscalYearOf(date){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date||''))return '';
 const [year,month,day]=date.split('-').map(Number),check=new Date(Date.UTC(year,month-1,day));
 if(check.getUTCFullYear()!==year||check.getUTCMonth()!==month-1||check.getUTCDate()!==day)return '';
 return String(year+543-(month<10?1:0));
}
function migrateFiscal(data){
 if(data.fiscalVersion===1)return false;
 for(const key of ['ledger','work','quota','household'])for(const row of data[key]||[]){
  row.originalSeason??=row.season??'';
  const year=fiscalYearOf(row.date);row.season=year;row.fiscalNeedsReview=!year;
 }
 data.previousSeasonLocks??=structuredClone(data.closed||{});
 data.closed={};data.fiscalVersion=1;return true;
}
const now=new Date(today()+'T12:00:00');
const defaultSeason=now.getFullYear()+543-(now.getMonth()<9?1:0);
const householdYear=defaultSeason;
const accountTitles={cane:'บัญชีไร่อ้อย',household:'บัญชีรายรับรายจ่ายในครัวเรือน'};
const householdTabs={householdHome:'ภาพรวม',household:'รายรับ–รายจ่าย'};
const plannedSeasons=['2568','2569','2570','2571','2572'];
const labels={home:'ภาพรวม',ledger:'รายรับ–รายจ่าย',plots:'แปลงอ้อย',work:'ค่าแรง',quotas:'ทะเบียนและสรุปโควต้า',quota:'ตั๋วชั่งและเจ้าของอ้อย',debts:'หนี้และเงินค้าง',assets:'รถ',rates:'อัตราค่าแรงและค่าบริการ',history:'ต้นทุนย้อนหลัง',backup:'สำรองข้อมูล'};
const plotAccounts=[['mother','ไร่ของแม่'],['tad','ไร่ของทัด'],['','ยังไม่ระบุกลุ่ม']];
const tadPlot={id:'plot-tad-5-rai',account:'tad',name:'แปลงตัวอย่าง',area:0,rent:'',note:''};
const base={plots:[],ledger:[],household:[],work:[],quota:[],debts:[],assets:[],
rates:[
{id:'r1',name:'ตัดอ้อยสด',kind:'ค่าแรง',unit:'วา',rate:13},{id:'r2',name:'ตัดอ้อยไฟไหม้',kind:'ค่าแรง',unit:'วา',rate:7},{id:'r3',name:'คนคีบอ้อย',kind:'ค่าแรง',unit:'ตัน',rate:12},{id:'r4',name:'คนขับรถส่งอ้อย',kind:'ค่าแรง',unit:'เที่ยว',rate:600},{id:'r5',name:'คนงานขึ้นอ้อย',kind:'ค่าแรง',unit:'ตัน',rate:20},{id:'r6',name:'คนเก็บอ้อย',kind:'ค่าแรง',unit:'ตัน',rate:7},{id:'r7',name:'บริการรถคีบ',kind:'รายรับ',unit:'ตัน',rate:120},{id:'r8',name:'บริการรถหกล้อ',kind:'รายรับ',unit:'ตัน',rate:230}],
closed:{}};
let recordSearch='';
const overviewYears={cane:'',household:''};
let db,version=0,account='',tab='home',edit=null,saving=false,local=false;
const selectedYears={cane:'',household:''};
let activeVehicle='', vehicleEntryKind='';
let debtPaymentId='', debtReferenceIndex=null, addingDebt=false, debtAllocationIndex=null, debtEditPaymentIndex=null;
let openDebtGroups=new Set();
const lists=['plots','ledger','household','work','quotaOwners','quota','debts','assets','rates'];
const season=()=>$('season').value;
const seasonalLists=['ledger','work','quota'];
const forSeason=(key,year=season())=>db[key].filter(row=>String(row.season)===year);
const seasonPeriod=year=>'ต.ค. '+year+' – ก.ย. '+(Number(year)+1);
function showSeasonOptions(){
 if(!account)return;
 const isHousehold=account==='household';
 const savedYears=isHousehold?db.household.map(row=>String(row.season)):
  [...Object.keys(db.closed),...seasonalLists.flatMap(key=>db[key].map(row=>String(row.season)))];
 const current=isHousehold?householdYear:defaultSeason;
 const preferred=String(isHousehold?current:Math.min(2572,Math.max(2568,current)));
 const years=[...new Set([...plannedSeasons,preferred,...savedYears.filter(year=>/^\d{4}$/.test(year))])].sort();
 const picker=$('season');
 const previous=selectedYears[account];
 picker.innerHTML=years.map(year=>'<option value="'+year+'">'+'ปีงบ '+year+(!isHousehold&&!plannedSeasons.includes(year)?' (ข้อมูลเดิม)':'')+'</option>').join('');
 picker.value=years.includes(previous)?previous:preferred;
}
const total=(rows,fn)=>cents(rows.reduce((s,x)=>s+fn(x),0));
const gross=x=>cents(num(x.qty)*num(x.rate));
const due=x=>cents(gross(x)-num(x.deduct)-num(x.paid));
const quotaHistory69=[];
const quotaRoles=[['grower','ลูกไร่'],['owner','เจ้าของโควต้า (อ้อยของตัวเอง)'],['','ยังไม่ระบุ']];
const caneTypes=[['fresh','อ้อยสด'],['burnt','อ้อยไฟไหม้'],['','ยังไม่ระบุ']];
const equipmentOwnership=[['own','รถของเรา'],['hired','รถของคนอื่น'],['','ยังไม่ระบุ']];
const quotaMethods=[['auto','หักตามสูตร'],['manual','ใช้ยอดหักที่กรอก'],['buy','ซื้ออ้อยแบบขายขาด']];
const quotaRole=x=>x.role||'';
const quotaWeight=value=>num(value).toLocaleString('th-TH',{maximumFractionDigits:3});
const quotaType=x=>caneTypes.find(([id])=>id===(x.cane||''))?.[1]||'ยังไม่ระบุ';
const quotaFeeLabels={check:'ค่าเช็ค',association:'ค่าสมาคม',tax:'ภาษี',haul:'ค่าคีบและบรรทุกเหมารวม',truck:'ค่าบรรทุก',loading:'ค่าคีบ',burn:'ค่าอ้อยไฟไหม้',analysis:'ค่าเครื่องวิเคราะห์',other:'รายจ่ายอื่น'};
const enteredRate=value=>value!==''&&value!=null&&Number.isFinite(Number(value))&&Number(value)>=0;
function quotaTransport(x){
 const {truckSource,loaderSource}=x;
 const validSource=source=>source==='own'||source==='hired';
 if(!truckSource&&!loaderSource)return {rates:{haul:350}};
 if(!validSource(truckSource)||!validSource(loaderSource))return {error:'เลือกรถบรรทุกและรถคีบให้ครบ'};
 if(truckSource==='own'&&loaderSource==='own')return {rates:{haul:350}};
 if(loaderSource==='hired'&&!enteredRate(x.loaderRate))return {error:'กรอกค่าคีบของรถคนอื่นที่หักจากลูกไร่ (ใส่ 0 หากไม่มีการหัก)'};
 if(truckSource==='own'&&!enteredRate(x.truckRate))return {error:'กรอกค่าบรรทุกของรถเราที่หักจากลูกไร่เมื่อจ้างรถคีบ (ใส่ 0 หากไม่มีการหัก)'};
 const truck=enteredRate(x.truckRate)?Number(x.truckRate):300;
 return {rates:{truck,loading:loaderSource==='own'?120:Number(x.loaderRate)}};
}
function quotaEquipmentLabel(row,key){
 const source=row[key+'Source'];
 if(!source)return '—';
 const label=equipmentOwnership.find(([id])=>id===source)?.[1]??'—';
 return source==='hired'&&row[key+'Provider']?label+' · '+row[key+'Provider']:label;
}
const quotaFormula=x=>{
 const raw=num(x.qty)*num(x.rate), tons=num(x.qty), thip=x.factory==='ทิพย์';
 return {check:raw*0.0025,association:tons*3,tax:raw*(thip?0.00808:0.0075),
  ...Object.fromEntries(Object.entries(quotaTransport(x).rates??{}).map(([key,rate])=>[key,tons*rate])),burn:x.cane==='burnt'?tons*30:0,analysis:thip?tons:0,other:num(x.deduct)};
};
const quotaDeductions=x=>x.fees?cents(Object.values(x.fees).reduce((a,b)=>a+num(b),0)):num(x.deduct);
const quotaNet=x=>cents(gross(x)-quotaDeductions(x));
const quotaPayable=x=>x.method==='buy'?cents(num(x.qty)*num(x.buyRate)):quotaNet(x);
const quotaDue=x=>quotaRole(x)==='owner'?0:cents(quotaPayable(x)-num(x.paid));
const quotaKey=x=>[x.factory,x.quota,x.ticket,x.name].map(v=>String(v??'').trim().toLowerCase()).join('\u001f');
function quotaTable(columns,rows,rowAction){
 if(!rows.length)return '<div class="empty">ยังไม่มีรายการ</div>';
 return '<div class="table"><table><thead><tr>'+columns.map(v=>'<th scope="col">'+esc(v)+'</th>').join('')+
  (rowAction?'<th scope="col">จัดการ</th>':'')+'</tr></thead><tbody>'+rows.map((r,i)=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+
  (rowAction?'<td>'+rowAction(i)+'</td>':'')+'</tr>').join('')+'</tbody></table></div>';
}
const quotaSummaryColumns=['ชื่อ','อ้อยสด (ตัน)','ไฟไหม้ (ตัน)','ยังไม่แยก (ตัน)','รวม (ตัน)','ยอดโรงงานก่อนหัก','รายจ่าย / รายการหัก','สุทธิหลังหัก'];
function quotaSummary(rows){
 const groups=new Map();
 for(const x of rows){
  const key=JSON.stringify([quotaRole(x),x.name.trim().toLowerCase()]);
  if(!groups.has(key))groups.set(key,{name:x.name,role:quotaRole(x),rows:[]});
  groups.get(key).rows.push(x);
 }
 const columns=[...quotaSummaryColumns,'ยอดจ่ายเจ้าของ','จ่ายแล้ว','คงจ่าย'];
 const sections=[['grower','ลูกไร่'],['owner','เจ้าของโควต้า · อ้อยของตัวเอง'],['','รายการเดิมที่ยังไม่ระบุประเภทเจ้าของ']];
 return sections.filter(([role])=>[...groups.values()].some(g=>g.role===role)).map(([role,title])=>{
  const lines=[...groups.values()].filter(g=>g.role===role).sort((a,b)=>a.name.localeCompare(b.name,'th')).map(g=>{
   const list=g.rows, weight=type=>quotaWeight(list.filter(x=>(x.cane||'')===type).reduce((a,x)=>a+num(x.qty),0));
   return [g.name,weight('fresh'),weight('burnt'),weight(''),quotaWeight(list.reduce((a,x)=>a+num(x.qty),0)),
    money(total(list,gross)),money(total(list,quotaDeductions)),money(total(list,quotaNet)),
    ...(role==='owner'?['—','—','—']:[money(total(list,quotaPayable)),money(total(list,x=>num(x.paid))),money(total(list,quotaDue))])];
  });
  return '<h3>'+title+'</h3>'+quotaTable(columns,lines);
 }).join('')||'<div class="empty">ยังไม่มีรายการในปีงบที่เลือก</div>';
}
function quotaOverview(rows){
 const groups=new Map();
 for(const row of rows){
  const key=JSON.stringify([row.factory,row.quota]);
  if(!groups.has(key))groups.set(key,[]);
  groups.get(key).push(row);
 }
 const lines=[...groups].map(([key,list])=>{
  const weight=type=>quotaWeight(list.filter(x=>type===undefined||(x.cane||'')===type).reduce((a,x)=>a+num(x.qty),0));
  const growers=list.filter(x=>quotaRole(x)!=='owner');
  return [...JSON.parse(key),weight('fresh'),weight('burnt'),weight(''),weight(),
   money(total(list,gross)),money(total(list,quotaDeductions)),money(total(growers,quotaPayable)),money(total(growers,quotaDue))];
 });
 return '<div class="box"><h2>ภาพรวมแยกตามโควต้า</h2><p class="muted">รวมน้ำหนักและยอดโรงงานของทุกเจ้าของในโควต้า ยอดโรงงานรวมมีเงินของลูกไร่ที่รับแทน</p>'+quotaTable(['โรงงาน','เลขโควต้า','สด (ตัน)','ไฟไหม้ (ตัน)','ยังไม่แยก (ตัน)','รวม (ตัน)','ยอดโรงงาน','รายจ่าย / รายการหัก','ยอดจ่ายเจ้าของ','คงจ่าย'],lines)+'</div>';
}
function historicalQuota(){
 if(season()!=='2568')return '';
 const groups=new Map();
 for(const row of quotaHistory69){
  if(!groups.has(row[0]))groups.set(row[0],[]);
  groups.get(row[0]).push(row);
 }
 const value=(rows,index)=>{
  const available=rows.filter(x=>x[index]!==null);
  return (available.length?money(total(available,x=>x[index])):'—')+(available.length<rows.length?' (ข้อมูลบางส่วน)':'');
 };
 const groupRows=owner=>[...groups].filter(([name])=>(name==='ทัด')===owner).sort(([a],[b])=>a.localeCompare(b,'th')).map(([name,rows])=>{
  const weight=i=>rows.reduce((a,x)=>a+x[i],0);
  return [name,quotaWeight(weight(1)),quotaWeight(weight(2)),quotaWeight(weight(1)+weight(2)),value(rows,3),value(rows,4),value(rows,5),owner?'—':value(rows,7)];
 });
 const columns=quotaSummaryColumns.filter((_,i)=>i!==3).concat('ยอดจ่ายตามวิธีคิดในไฟล์');
 const details=quotaHistory69.map(([name,fresh,burnt,gross,fees,net,method,payout,file,note])=>[name,file,quotaWeight(fresh),quotaWeight(burnt),money(gross),fees===null?'—':money(fees),method==='owner'||payout===null?'—':money(payout),note]);
 return '<div class="box"><h2>ข้อมูลอ้างอิงปีงบ 68 · ไฟล์อ้อยปี 69</h2><p class="muted">อ้างอิงงวด ม.ค.–มี.ค. 2569 แยกจากรายการที่กรอกในเว็บ ยอดจ่ายตามไฟล์เป็นยอดคำนวณ ส่วนสถานะจ่ายดูได้ในรายละเอียด</p><h3>ลูกไร่</h3>'+quotaTable(columns,groupRows(false))+'<h3>เจ้าของโควต้า · อ้อยของทัด</h3>'+quotaTable(columns,groupRows(true))+'<details><summary>ดูยอดรายไฟล์และจุดที่ต้องตรวจสอบ</summary>'+quotaTable(['ชื่อ','ไฟล์ต้นทาง','สด (ตัน)','ไฟไหม้ (ตัน)','ยอดก่อนหัก','รายจ่าย / รายการหัก','ยอดจ่ายตามไฟล์','หมายเหตุ'],details)+'</details></div>';
}
function quotaPreview(form){
 const x=Object.fromEntries(new FormData(form));
 const out=form.querySelector('[data-quota-preview]');
 const transport=quotaTransport(x);
 if(x.method!=='manual'&&transport.error){out.textContent=transport.error;return;}
 if(!x.qty||!x.rate){out.textContent='กรอกน้ำหนักและราคาเพื่อดูยอดคำนวณ';return;}
 if(x.method!=='manual'&&(!x.cane||x.factory==='อื่น ๆ')){out.textContent='เลือกประเภทอ้อยและโรงงานที่มีสูตร หรือเลือกกรอกยอดหักเอง';return;}

 const work=forSeason('work',year).filter(x=>plot===undefined||x.plot===plot);

function readLegacyCsv(raw){
 const rows=[];let row=[],value='',quoted=false;
 const source=raw.replace(/^\uFEFF/,'');
 for(let i=0;i<source.length;i++){
  const c=source[i];
  if(c==='"'){if(quoted&&source[i+1]==='"'){value+='"';i++;}else quoted=!quoted;}
  else if(c===','&&!quoted){row.push(value);value='';}
  else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&source[i+1]==='\n')i++;row.push(value);rows.push(row);row=[];value='';}
  else value+=c;
 }
 if(quoted)throw Error('CSV quotes');
 if(row.length||value)rows.push([...row,value]);
 const expected='วันที่,ประเภท,รายการ,แปลง,จำนวน,หน่วย,อัตราต่อหน่วย,จำนวนเงิน,หมายเหตุ';
 if(rows.shift()?.join(',')!==expected)throw Error('CSV header');
 const seen=new Map();
 return rows.filter(r=>r.some(Boolean)).map(r=>{
  const [date,type,name,plot,qty,unit,rate,amount,note]=r;
  if(r.length!==9||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!['รายรับ','รายจ่าย'].includes(type)||!Number.isFinite(Number(amount))||num(amount)<=0)throw Error('CSV row');
  const [year,month]=date.split('-').map(Number);
  const key=JSON.stringify(r),occurrence=(seen.get(key)??0)+1;seen.set(key,occurrence);
  return {id:'legacy-'+encodeURIComponent(key)+'-'+occurrence,date,kind:type==='รายรับ'?'income':'expense',name,plot:db.plots.find(p=>p.name===plot)?.id??'',qty:unit==='ตัน'?num(qty):'',rate:unit==='ตัน'?num(rate):'',amount:num(amount),note:[note,plot&&!db.plots.some(p=>p.name===plot)?'แปลงเดิม '+plot:'',qty?qty+' '+unit+' × '+rate:''].filter(Boolean).join(' · '),season:String(year+543-(month<4?1:0))};
 });
}

document.addEventListener('submit',event=>{
 const k=event.target.dataset.form;if(!k)return;event.preventDefault();if(saving)return;
 const input=Object.fromEntries([...new FormData(event.target)].map(([key,value])=>[key,value.trim()]));
 if(['menu-add','menu-edit','menu-note'].includes(k)){
  const next=structuredClone(db),items=next.menuSettings[account];
  if(k==='menu-add'){if(!input.name)return;const id='custom-'+crypto.randomUUID();if(!['folder','page'].includes(input.type)||!canNest(items,id,input.parent))return;items.push({id,name:input.name.slice(0,80),type:input.type,parent:input.parent,hidden:false});}
  else{const item=items.find(x=>x.id===input.id);if(!item)return;if(k==='menu-note'){if(item.type!=='page')return;item.note=input.note;}else{if(!input.name||!canNest(items,item.id,input.parent))return alert('ไม่สามารถย้ายโฟลเดอร์เข้าไปอยู่ในตัวเองได้');item.name=input.name.slice(0,80);item.parent=input.parent;item.hidden=input.hidden==='yes';}}
  void commit(next);return;
 }
 if(k==='record-search'){recordSearch=input.query||'';renderSearch();return;}
 if(k==='debt-edit-payment'){

  for(const [key,,type] of debtPaymentEditFields(row,entry)){
   const value=input[key]??'';
   if(type==='date'||type==='optional'){entry[key]=value;continue;}
   if(value===''&&type==='optionalNumber'){delete entry[key];continue;}
   const amount=cents(Number(value));
   if(value===''||!Number.isFinite(amount)||amount<(type==='positive'?0.01:0))return alert('กรุณาตรวจจำนวนเงินในแต่ละช่อง');
   entry[key]=amount;
  }
  if(isCooperativeDebt(row)&&payments.some(item=>item!==entry&&(item.date===entry.date||(entry.installment&&item.installment===entry.installment))))return alert('มีวันที่หรืองวดนี้อยู่แล้ว กรุณาตรวจประวัติ');
  if(debtPaymentTotal(entry)<=0||debtDue(row)<0)return alert('ยอดจ่ายต้องมากกว่า 0 และเงินต้นที่ชำระต้องไม่เกินยอดหนี้');
  void commit(next);return;
 }
 if(['debt-unallocated','debt-allocation','debt-reported-balance'].includes(k)){
  const next=structuredClone(db),row=next.debts.find(item=>item.id===debtPaymentId);
  if(!row||row.kind==='เงินค้างรับ'||isCooperativeDebt(row))return;
  const payments=debtPayments(row);
  if(k==='debt-unallocated'){
   const totalPaid=cents(Number(input.totalPaid));
   if(!input.date||!Number.isFinite(totalPaid)||totalPaid<=0)return alert('กรอกวันที่และยอดจ่ายจริงที่มากกว่า 0');
   const entry={date:input.date,amount:0,totalPaid,allocationPending:true};
   if(input.reportedBalance){
    const reportedBalance=cents(Number(input.reportedBalance));
    if(!Number.isFinite(reportedBalance)||reportedBalance<0)return alert('ยอดหนี้คงเหลือต้องเป็น 0 หรือมากกว่า');
    entry.reportedBalance=reportedBalance;
   }
   row.payments=[...payments,entry];
   if(debtDue(row)<0)return alert('ยอดนี้ต่ำกว่าเงินต้นที่ชำระหลังงวดนี้ กรุณาตรวจยอดจากเจ้าหนี้');
  }else if(k==='debt-reported-balance'){
   const pending=payments[debtAllocationIndex],reportedBalance=cents(Number(input.reportedBalance));
   if(!pending?.allocationPending||!input.reportedBalance||!Number.isFinite(reportedBalance)||reportedBalance<0)return alert('กรอกยอดหนี้หลังจ่ายตั้งแต่ 0 ขึ้นไป');
   pending.reportedBalance=reportedBalance;
   if(debtDue(row)<0)return alert('ยอดนี้ต่ำกว่าเงินต้นที่ชำระหลังงวดนี้ กรุณาตรวจยอดจากเจ้าหนี้');
  }else{
   const pending=payments[debtAllocationIndex];
   const amount=cents(Number(input.amount)),interest=cents(Number(input.interest)),fees=cents(Number(input.fees||0));
   const timeline=debtTimeline(row),lastCheckpoint=debtCheckpoint(timeline);
   const reflected=lastCheckpoint>=0&&timeline.indexOf(pending)<=lastCheckpoint;
   if(!pending?.allocationPending||!input.amount||!input.interest||![amount,interest,fees].every(value=>Number.isFinite(value)&&value>=0)||
    debtPaymentTotal({amount,interest,fees})!==pending.totalPaid||(!reflected&&amount>debtDue(row)))return alert('เงินต้น ดอกเบี้ย และค่าธรรมเนียมรวมกันต้องตรงกับยอดจ่ายจริง และเงินต้นต้องไม่เกินยอดคงเหลือ');
   payments[debtAllocationIndex]={...pending,allocationPending:false,amount,interest,fees};
  }
  void commit(next);return;
 }
 if(k==='debt-payment'){
  const next=structuredClone(db),row=next.debts.find(item=>item.id===debtPaymentId);
  const amount=cents(Number(input.amount));
  const incoming=row?.kind==='เงินค้างรับ';
  const cooperative=row&&isCooperativeDebt(row);
  if(!row||!input.date||!input.amount||!Number.isFinite(amount)||amount<(incoming?0.01:0)||amount>debtDue(row))return alert('ตรวจวันที่และยอดงวด เงินต้นต้องไม่เกินยอดคงเหลือ');
  const payments=debtPayments(row);
  const entry={date:input.date,amount};
  if(!incoming){
   const interest=cents(Number(input.interest));
   if(!input.interest||!Number.isFinite(interest)||interest<0)return alert('กรอกดอกเบี้ยตามยอดที่ชำระ หากไม่มีให้ใส่ 0');
   entry.interest=interest;
   if(!cooperative){
    const fees=cents(Number(input.fees||0));
    if(!Number.isFinite(fees)||fees<0)return alert('ค่าธรรมเนียมต้องเป็น 0 หรือมากกว่า');
    entry.fees=fees;
   }
  }
  if(cooperative){
   const shares=cents(Number(input.shares));
   if(!input.shares||!Number.isFinite(shares)||shares<0)return alert('กรอกยอดหุ้นตามใบเสร็จ หากไม่มีให้ใส่ 0');
   const startingReceipt=payments.find(item=>Number.isFinite(item.accumulatedShares));
   if(startingReceipt&&input.date<startingReceipt.date)return alert('ใบเสร็จนี้มาก่อนยอดตั้งต้นที่ใช้ติดตามหนี้และหุ้น');
   if(payments.some(item=>item.date===input.date||(input.installment&&item.installment===input.installment)))return alert('มีรายการวันที่หรืองวดนี้แล้ว กรุณาตรวจประวัติการชำระ');
   Object.assign(entry,{shares,installment:input.installment||''});
  }
  if(debtPaymentTotal(entry)<=0)return alert('ยอดจ่ายรวมหรือยอดรับต้องมากกว่า 0');
  row.payments=[...payments,entry];
  void commit(next);return;
 }
 if(spec[k].some(([key,,type])=>!String(type).startsWith('optional')&&!['plot','role','cane','account','vehicle','truckSource','loaderSource','quotaOwnerId','factory'].includes(key)&&!input[key]))return alert('กรุณากรอกข้อมูลให้ครบ');
 for(const [key,,type] of spec[k])if(['positive','number','optionalNumber','tons'].includes(type)&&input[key]!=='')input[key]=num(input[key]);
 const next=structuredClone(db),id=edit?.key===k?edit.id:crypto.randomUUID();
 const row={...input,id};
 if(['household',...seasonalLists].includes(k)){
  const year=fiscalYearOf(row.date);
  if(!year||year!==season())return alert('วันที่ต้องอยู่ในปีงบ '+season()+' ('+seasonPeriod(season())+') ที่เลือกไว้ด้านบน');
  row.season=year;row.fiscalNeedsReview=false;
 }
 if(['ledger','work','quota'].includes(k)){if(next.closed[season()])return;row.season=season();}
 if(k==='work'&&due(row)<0)return alert('ยอดหักและยอดจ่ายแล้วรวมกันต้องไม่เกินยอดที่คำนวณได้');
 if(k==='debts'){
  const previous=next.debts.find(item=>item.id===id);
  if(previous?.payments)row.payments=previous.payments;
  const previousGroup=previous&&debtGroups.find(group=>group.kinds.includes(previous.kind));
  const reference=oldDebts[debtReferenceIndex]??(previousGroup&&oldDebts.find(([scope,name])=>previousGroup.scopes.includes(scope)&&name===String(previous.name??'').trim()));
  if(previous?.referenceKey||reference)row.referenceKey=previous?.referenceKey??debtReferenceKey(reference);
  if(debtDue(row)<0)return alert('ยอดชำระรวมทุกงวดต้องไม่เกินยอดตั้งต้น');
  if(debtReferenceIndex!==null&&next.debts.some(item=>item.id!==id&&(item.referenceKey===row.referenceKey||(String(item.name??'').trim()===row.name&&item.kind===row.kind))))return alert('มีรายการนี้ในบัญชีจริงแล้ว กรุณาแก้ไขรายการเดิม');
 }
 if(k==='quotaOwners'){
  if(next.quotaOwners.some(x=>x.id!==id&&x.name.trim()===row.name&&x.factory===row.factory&&x.code===row.code))return alert('มีโควต้านี้แล้ว กรุณาแก้ไขรายการเดิม');
 }
 if(k==='quota'){
  if(!row.factory)return alert('กรุณาระบุโรงงาน');

  if(owner&&((owner.factory&&owner.factory!==row.factory)||(owner.code&&owner.code!==row.quota)))return alert('เลขโควต้าหรือโรงงานไม่ตรงกับทะเบียน กรุณาตรวจสอบทะเบียนโควต้าก่อน');
  const old=next.quota.find(x=>x.id===id);
  if(!old&&!owner)return alert('กรุณาเลือกโควต้า หากยังไม่มีให้เพิ่มในทะเบียนและสรุปโควต้าก่อน');
  if((!row.role||!row.cane)&&!old)return alert('กรุณาระบุประเภทเจ้าของและประเภทอ้อย');
  if(row.method==='auto'||row.method==='buy'){
   if(!old&&(!row.truckSource||!row.loaderSource))return alert('เลือกรถบรรทุกและรถคีบให้ครบ');
   const transport=quotaTransport(row);
   if(transport.error)return alert(transport.error);
   if(!row.cane||row.factory==='อื่น ๆ')return alert('สูตรอัตโนมัติใช้กับนครเพชรและทิพย์ กรุณาระบุประเภทอ้อย หรือเลือกกรอกยอดหักเอง');
   row.fees=quotaFormula(row);
  }
  if(row.method==='buy'&&(num(row.buyRate)<=0||row.role!=='grower'))return alert('กรุณาระบุราคาซื้อขาดและเลือกประเภทลูกไร่');
  if(row.role==='owner'&&num(row.paid)>0)return alert('อ้อยของเจ้าของโควต้าไม่ต้องบันทึกยอดจ่ายให้ตัวเอง');
  if(row.role!=='owner'&&quotaDue(row)<0)return alert('ยอดจ่ายแล้วต้องไม่เกินยอดที่ต้องจ่าย');
  if(next.quota.some(x=>x.id!==id&&String(x.season)===row.season&&quotaKey(x)===quotaKey(row)))return alert('มีเจ้าของอ้อยรายนี้ในตั๋วชั่งเดียวกันแล้ว');
 }
 const index=next[k].findIndex(x=>x.id===id);
 if(index===-1)next[k].unshift(row);else next[k][index]=row;
 void commit(next);

document.addEventListener('change',async event=>{
 const el=event.target;
 if(el.name==='quotaOwnerId'&&el.form?.dataset.form==='quota'){
  const owner=db.quotaOwners.find(x=>x.id===el.value);
  if(owner){if(owner.code)el.form.elements.quota.value=owner.code;if(owner.factory)el.form.elements.factory.value=owner.factory;}
  quotaPreview(el.form);
 }
 if(el.id==='season'&&el.value){selectedYears[account]=el.value;if(['home','householdHome','years'].includes(tab))overviewYears[account]=el.value;edit=null;vehicleEntryKind='';render();}
 if(el.id==='active-vehicle'){activeVehicle=el.value;edit=null;vehicleEntryKind='';render();}
 if(['qty','rate'].includes(el.name)&&el.form?.dataset.form==='ledger'&&el.form.elements.qty.value&&el.form.elements.rate.value)el.form.elements.amount.value=cents(num(el.form.elements.qty.value)*num(el.form.elements.rate.value));
 if(el.name==='job'){const rate=db.rates.find(x=>x.name===el.value);if(rate){el.form.elements.rate.value=rate.rate;if(!el.form.elements.note.value||db.rates.some(r=>r.unit===el.form.elements.note.value))el.form.elements.note.value=rate.unit;}}
 if(el.id==='import'&&el.files[0]){
  try{
   const raw=await el.files[0].text();
   if(el.files[0].name.toLowerCase().endsWith('.csv')){
    const next=structuredClone(db),known=new Set(next.ledger.map(x=>x.id)),rows=readLegacyCsv(raw).filter(x=>!known.has(x.id));
    for(const row of rows){row.season=fiscalYearOf(row.date);row.fiscalNeedsReview=!row.season;}
    if(!rows.length)return alert('ไม่มีรายการใหม่ในไฟล์นี้');
    if(rows.some(x=>next.closed[x.season]))return alert('มีรายการในฤดูที่ปิดแล้ว กรุณาเปิดฤดูนั้นก่อนนำเข้า');
    if(confirm('เพิ่มรายการจากเว็บเดิม '+rows.length+' รายการหรือไม่')){next.ledger.unshift(...rows);await commit(next);}
    return;
   }
   const incoming=JSON.parse(raw);
   if(incoming)migrateFiscal(incoming);
   if(incoming&&incoming.menuSettings===undefined)incoming.menuSettings=structuredClone(db.menuSettings);
   if(incoming&&incoming.quotaOwners===undefined)incoming.quotaOwners=structuredClone(db.quotaOwners);
   if(incoming&&incoming.household===undefined)incoming.household=structuredClone(db.household);
   if(!incoming.closed||Array.isArray(incoming.closed)||!lists.every(k=>Array.isArray(incoming[k])&&incoming[k].every(x=>x&&typeof x.id==='string')&&new Set(incoming[k].map(x=>x.id)).size===incoming[k].length))throw Error('format');
   if(!confirm('นำข้อมูลจากไฟล์สำรองนี้มาแทนที่รายการที่มีในไฟล์หรือไม่'))return;
   await commit(incoming);
  }catch{alert('รูปแบบไฟล์สำรองไม่ถูกต้อง');}
  finally{el.value='';}
 }
});
async function load(){
 local=location.protocol==='file:';
 try{
  if(local){db=JSON.parse(localStorage.getItem('sugarcane-private-ledger-v1')||'null')??structuredClone(base);$('status').textContent='เก็บข้อมูลในเบราว์เซอร์นี้';}
  else{
   const response=await fetch('/api/ledger',{cache:'no-store'});
   if(!response.ok)throw Error('load');
   const state=await response.json();db=state.data??structuredClone(base);version=state.version;$('status').textContent='บัญชีส่วนตัว · ซิงก์ออนไลน์';
  }
  db.household??=[];
  migrateFiscal(db);
  ensureQuotaOwners(db);
  ensureMenus(db);
  restorePlotAccounts(db);
  showSeasonOptions();
  render();
 }catch{$('status').textContent='โหลดบัญชีไม่สำเร็จ';$('screen').textContent='กรุณาเข้าสู่ระบบและโหลดหน้าใหม่';}
}
